<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Notepad</title>
  <style>
    :root {
      --bg-base: #121216;
      --card: rgba(255, 255, 255, 0.92);
      --text: #111111;
      --muted: #4b5563;
      --accent: #007aff;
      --danger: #b91c1c;
      --border: rgba(255, 255, 255, 0.22);
      --seg-bg: rgba(255, 255, 255, 0.16);
      --photo-opacity: 0.20;
      --photo-brightness: 0.45;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg-base); color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .bg-photo-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      opacity: var(--photo-opacity); filter: brightness(var(--photo-brightness));
      transition: opacity 0.15s ease, filter 0.15s ease;
    }
    .bg-scrim-layer {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: rgba(14, 14, 18, 0.68);
      transition: background 0.15s ease;
    }
    .app { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }
    .header {
      padding: 12px 16px 8px;
      background: rgba(18, 18, 24, 0.65);
      border-bottom: 1px solid var(--border);
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .header-title { font-size: 24px; font-weight: 700; margin: 0; }
    .add-btn {
      background: var(--accent); color: #fff; border: none; border-radius: 999px;
      padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .search-input {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.94); color: #111; font-size: 15px; margin-bottom: 8px; outline: none;
    }
    .segmented {
      display: grid; grid-template-columns: repeat(3, 1fr);
      background: var(--seg-bg); padding: 3px; border-radius: 10px; gap: 2px;
    }
    .seg-btn {
      border: none; background: transparent; color: #f3f4f6; padding: 7px 6px;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .seg-btn.active { background: rgba(255,255,255,0.94); color: #111; }
    .tab-pills { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 2px; scrollbar-width: none; }
    .tab-pills::-webkit-scrollbar { display: none; }
    .tab-pills.hidden { display: none; }
    .pill {
      border: 1px solid var(--border); background: rgba(255,255,255,0.88); color: #111;
      border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600;
      white-space: nowrap; cursor: pointer;
    }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .banner {
      margin: 8px 16px 0; padding: 10px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.95); color: #111; font-size: 13px; font-weight: 500;
      display: none; justify-content: space-between; align-items: center; gap: 10px;
    }
    .banner.show { display: flex; }
    .banner-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .viewport { flex: 1; overflow: hidden; position: relative; }
    .pages { display: flex; width: 300%; height: 100%; transition: transform 0.25s ease; }
    .page { width: calc(100% / 3); height: 100%; overflow-y: auto; padding: 12px 16px 36px; }
    .note-card {
      background: var(--card); color: var(--text); border-radius: 14px;
      padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      transition: transform 0.15s ease; cursor: pointer;
    }
    .note-card.dark-card { color: #f8fafc; }
    .note-card.dark-card .badge { background: rgba(255,255,255,0.18); color: #f8fafc; }
    .note-card.dark-card .note-meta { color: rgba(248,250,252,0.7); }
    .note-card.dark-card .card-actions { border-top-color: rgba(255,255,255,0.16); }
    .note-card.dark-card .mini-btn { background: rgba(255,255,255,0.14); color: #f8fafc; border-color: rgba(255,255,255,0.24); }
    .note-card.dark-card .mini-btn.danger { color: #fca5a5; }
    .note-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .note-title { font-size: 16px; font-weight: 700; margin: 0; flex: 1; word-break: break-word; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; background: rgba(0,0,0,0.1); }
    .note-body {
      font-size: 14px; margin: 0 0 8px; white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden;
    }
    .note-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .card-actions { display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 8px; }
    .mini-btn { border: 1px solid rgba(0,0,0,0.16); background: #fff; color: #111; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .mini-btn.danger { color: var(--danger); }
    .box { background: rgba(255,255,255,0.93); color: #111; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .box h3 { margin: 0 0 6px; font-size: 17px; }
    .box p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-primary, .btn-secondary { width: 100%; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { border: none; background: var(--accent); color: #fff; }
    .btn-secondary { border: 1px solid rgba(0,0,0,0.2); background: #fff; color: #111; }
    .btn-danger-outline { border: 1px solid rgba(185,28,28,0.35); background: #fff; color: var(--danger); border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
    .slider-row span:first-child { min-width: 72px; }
    .slider-row input[type="range"] { flex: 1; }
    .full-modal { position: fixed; inset: 0; background: rgba(18,18,24,0.97); color: #fff; z-index: 100; display: none; flex-direction: column; padding: 16px; overflow-y: auto; }
    .full-modal.open { display: flex; }
    .modal-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
    .modal-title { font-size: 16px; font-weight: 700; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-btn { border: none; background: none; color: #60a5fa; font-size: 15px; font-weight: 600; cursor: pointer; padding: 4px 2px; }
    .field-input, .field-textarea {
      width: 100%; border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.95); color: #111;
      border-radius: 12px; padding: 12px; font-size: 15px; margin-bottom: 10px; font-family: inherit; outline: none;
    }
    .field-textarea { flex: 1; min-height: 220px; resize: none; line-height: 1.5; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.45); cursor: pointer; }
    .box .swatch { border-color: rgba(0,0,0,0.22); }
    .swatch.active { transform: scale(1.12); box-shadow: 0 0 0 2px var(--accent); border-color: #fff; }
    input[type="color"] { width: 32px; height: 32px; border: none; background: none; padding: 0; cursor: pointer; }
    mark { background: #fde047; color: #111; border-radius: 3px; padding: 0 2px; }
    .empty-state { text-align: center; color: #f3f4f6; padding: 48px 16px; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="bg-photo-layer" id="bgPhotoLayer"></div>
  <div class="bg-scrim-layer" id="bgScrimLayer"></div>

  <div class="app">
    <div class="header">
      <div class="header-top">
        <h1 class="header-title">Notepad</h1>
        <button class="add-btn" id="newNoteBtn">+ New Note</button>
      </div>
      <input class="search-input" id="searchInput" type="search" placeholder="Search by title, tab, or note..." />
      <div class="segmented">
        <button class="seg-btn active" id="tab0">All (0)</button>
        <button class="seg-btn" id="tab1">Pinned (0)</button>
        <button class="seg-btn" id="tab2">Backup / Restore</button>
      </div>
    </div>

    <div class="tab-pills" id="tabPills"></div>

    <div class="banner" id="banner">
      <span id="bannerText"></span>
      <div class="banner-actions">
        <button class="link-btn" id="bannerUndo" style="display:none; color:#007aff;">Undo</button>
        <button class="link-btn" id="bannerOk" style="color:#007aff;">OK</button>
      </div>
    </div>

    <div class="viewport" id="viewport">
      <div class="pages" id="pagesTrack">
        <div class="page" id="pageAll"></div>
        <div class="page" id="pagePinned"></div>
        <div class="page" id="pageBackup">
          <div class="box">
            <h3>Export Backup (.notedatabase only)</h3>
            <p>Export all notes strictly in <strong>.notedatabase</strong> format.</p>
            <button class="btn-primary" id="exportBtn">Create .notedatabase Backup</button>
          </div>
          <div class="box">
            <h3>Restore Any Notepad Backup</h3>
            <p>Select <strong>.notedatabase</strong>, <strong>.json</strong>, <strong>.txt</strong>, <strong>.md</strong>, or any backup file.</p>
            <button class="btn-secondary" id="importBtn">Select Backup File</button>
            <input type="file" id="fileInput" multiple hidden accept="*/*" />
          </div>
          <div class="box">
            <h3>Background Photo & Brightness</h3>
            <p>Choose a wallpaper photo from your device and adjust tint & brightness.</p>
            <div class="btn-row">
              <button class="btn-secondary" id="chooseBgBtn">Choose Photo</button>
              <button class="btn-danger-outline" id="removeBgBtn" style="display:none;">Remove</button>
              <input type="file" id="bgPhotoInput" hidden accept="image/*" />
            </div>
            <div class="slider-row"><span>Visibility</span><input type="range" id="opSlider" min="5" max="60" value="20" /><span id="opVal">20%</span></div>
            <div class="slider-row"><span>Brightness</span><input type="range" id="brSlider" min="15" max="100" value="45" /><span id="brVal">45%</span></div>
            <div class="swatches" id="scrimSwatches">
              <button class="swatch" data-scrim="rgba(14,14,18,0.68)" style="background:#18181b"></button>
              <button class="swatch" data-scrim="rgba(28,24,14,0.66)" style="background:#fef08a"></button>
              <button class="swatch" data-scrim="rgba(12,24,38,0.68)" style="background:#bae6fd"></button>
              <button class="swatch" data-scrim="rgba(12,32,22,0.68)" style="background:#bbf7d0"></button>
              <input type="color" id="customScrimPicker" value="#121216" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="full-modal" id="viewModal">
    <div class="modal-bar">
      <button class="link-btn" id="closeViewBtn">← Back</button>
      <strong class="modal-title" id="viewTitle">Note</strong>
      <button class="link-btn" id="editFromViewBtn">Edit</button>
    </div>
    <div id="viewMeta" style="font-size:12px; opacity:0.75; margin-bottom:12px;"></div>
    <div id="viewBody" style="white-space:pre-wrap; word-break:break-word; font-size:16px; line-height:1.6;"></div>
  </div>

  <div class="full-modal" id="editModal">
    <div class="modal-bar">
      <button class="link-btn" id="cancelEditBtn">Cancel</button>
      <strong class="modal-title" id="editHeading">New Note</strong>
      <button class="link-btn" id="saveEditBtn">Save</button>
    </div>
    <input class="field-input" id="editTitle" type="text" placeholder="Title" />
    <input class="field-input" id="editTab" type="text" placeholder="Tab / Category (optional)" />
    <div class="swatches" id="noteSwatches">
      <button class="swatch" data-notebg="" style="background:#ffffff"></button>
      <button class="swatch" data-notebg="#fef08a" style="background:#fef08a"></button>
      <button class="swatch" data-notebg="#bae6fd" style="background:#bae6fd"></button>
      <button class="swatch" data-notebg="#bbf7d0" style="background:#bbf7d0"></button>
      <button class="swatch" data-notebg="#fbcfe8" style="background:#fbcfe8"></button>
      <button class="swatch" data-notebg="#fed7aa" style="background:#fed7aa"></button>
      <input type="color" id="customNoteBgPicker" value="#ffffff" />
    </div>
    <textarea class="field-textarea" id="editContent" placeholder="Write your note..."></textarea>
  </div>

  <script>
    const KEY = "notepad_offline_v1", PREF_KEY = "notepad_bg_prefs_v1";
    let notes = [], curPage = 0, curTab = "ALL", qStr = "", viewId = null, editId = null, noteBg = "";
    let lastDeleted = null, bannerTimer = null, cardGestureActive = false;

    const pagesTrack = document.getElementById("pagesTrack"), viewport = document.getElementById("viewport");
    const pageAll = document.getElementById("pageAll"), pagePinned = document.getElementById("pagePinned");
    const tabPills = document.getElementById("tabPills"), banner = document.getElementById("banner"), bannerText = document.getElementById("bannerText");
    const bannerUndo = document.getElementById("bannerUndo");
    const viewModal = document.getElementById("viewModal"), editModal = document.getElementById("editModal");
    const bgPhotoLayer = document.getElementById("bgPhotoLayer"), bgScrimLayer = document.getElementById("bgScrimLayer");
    const removeBgBtn = document.getElementById("removeBgBtn");

    function notify(msg, allowUndo = false) {
      clearTimeout(bannerTimer);
      bannerText.textContent = msg;
      bannerUndo.style.display = allowUndo ? "inline-block" : "none";
      banner.classList.add("show");
      bannerTimer = setTimeout(() => { banner.classList.remove("show"); }, allowUndo ? 6000 : 3500);
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(notes)); }
      catch { notify("Storage full! Export backup or remove large photo."); }
    }

    function getPrefs() {
      try { return JSON.parse(localStorage.getItem(PREF_KEY) || "{}"); } catch { return {}; }
    }

    function applyPrefs(p) {
      const op = Math.max(5, Math.min(60, Number(p.opacity ?? 20)));
      const br = Math.max(15, Math.min(100, Number(p.brightness ?? 45)));
      const sc = p.scrim || "rgba(14,14,18,0.68)";
      const photo = typeof p.photo === "string" ? p.photo : "";

      bgPhotoLayer.style.opacity = String(op / 100);
      bgPhotoLayer.style.filter = `brightness(${br / 100})`;
      bgPhotoLayer.style.backgroundImage = photo ? `url("${photo}")` : "none";
      removeBgBtn.style.display = photo ? "inline-block" : "none";
      bgScrimLayer.style.background = sc;

      document.getElementById("opSlider").value = op; document.getElementById("opVal").textContent = op + "%";
      document.getElementById("brSlider").value = br; document.getElementById("brVal").textContent = br + "%";
      document.querySelectorAll("#scrimSwatches .swatch").forEach(b => b.classList.toggle("active", b.dataset.scrim === sc));

      try { localStorage.setItem(PREF_KEY, JSON.stringify({ opacity: op, brightness: br, scrim: sc, photo })); }
      catch { notify("Photo is too large for storage. Try a smaller image."); }
    }

    function load() {
      try { notes = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { notes = []; }
      applyPrefs(getPrefs());
    }

    function setPage(i) {
      curPage = Math.max(0, Math.min(2, i));
      pagesTrack.style.transform = `translateX(-${curPage * (100 / 3)}%)`;
      [0, 1, 2].forEach(idx => document.getElementById("tab" + idx).classList.toggle("active", idx === curPage));
      tabPills.classList.toggle("hidden", curPage === 2);
    }

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function hi(t, q) {
      const s = esc(t);
      if (!q) return s;
      const safeQ = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return s.replace(new RegExp(`(${safeQ})`, "gi"), "<mark>$1</mark>");
    }

    function isDarkColor(hex) {
      if (!hex || !hex.startsWith("#") || hex.length < 7) return false;
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) < 130;
    }

    function renderPills() {
      const tabs = Array.from(new Set(notes.map(n => (n.tab || "").trim()).filter(Boolean)));
      if (curTab !== "ALL" && !tabs.includes(curTab)) curTab = "ALL";
      tabPills.innerHTML = "";
      const allB = document.createElement("button");
      allB.className = "pill" + (curTab === "ALL" ? " active" : "");
      allB.textContent = "All Tabs";
      allB.onclick = () => { curTab = "ALL"; render(); };
      tabPills.appendChild(allB);
      tabs.forEach(t => {
        const b = document.createElement("button");
        b.className = "pill" + (curTab === t ? " active" : "");
        b.textContent = t;
        b.onclick = () => { curTab = t; render(); };
        tabPills.appendChild(b);
      });
    }

    function filtered(pinnedOnly) {
      const q = qStr.trim().toLowerCase();
      return notes.filter(n => {
        if (pinnedOnly && !n.isPinned) return false;
        if (curTab !== "ALL" && (n.tab || "").trim() !== curTab) return false;
        if (!q) return true;
        return (n.title || "").toLowerCase().includes(q) || (n.tab || "").toLowerCase().includes(q) || (n.content || "").toLowerCase().includes(q);
      }).sort((a, b) => {
        if (q) {
          const aT = (a.title || "").toLowerCase().includes(q) ? 1 : 0;
          const bT = (b.title || "").toLowerCase().includes(q) ? 1 : 0;
          if (aT !== bT) return bT - aT;
        }
        if (Boolean(a.isPinned) !== Boolean(b.isPinned)) return a.isPinned ? -1 : 1;
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });
    }

    function renderList(el, list, empty) {
      el.innerHTML = "";
      if (!list.length) { el.innerHTML = `<div class="empty-state">${empty}</div>`; return; }
      const q = qStr.trim();
      list.forEach(n => {
        const card = document.createElement("div");
        card.className = "note-card" + (isDarkColor(n.bgColor) ? " dark-card" : "");
        if (n.bgColor) card.style.background = n.bgColor;
        const dt = n.updatedAt ? new Date(n.updatedAt).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";

        card.innerHTML = `
          <div class="note-top">
            <h4 class="note-title">${hi(n.title || "Untitled Note", q)}</h4>
            ${n.tab ? `<span class="badge">${hi(n.tab, q)}</span>` : ""}
            ${n.isPinned ? `<span class="badge">Pinned</span>` : ""}
          </div>
          <p class="note-body">${hi(n.content || "", q)}</p>
          ${dt ? `<div class="note-meta">${dt}</div>` : ""}
          <div class="card-actions">
            <button class="mini-btn open-b">Open</button>
            <button class="mini-btn pin-b">${n.isPinned ? "Unpin" : "Pin"}</button>
            <button class="mini-btn danger del-b">Delete</button>
          </div>`;

        let sx = 0, sy = 0, dx = 0, horizSwipe = false, moved = false;
        card.addEventListener("touchstart", e => {
          sx = e.touches[0].clientX; sy = e.touches[0].clientY;
          dx = 0; horizSwipe = false; moved = false; cardGestureActive = false;
        }, { passive: true });

        card.addEventListener("touchmove", e => {
          const cx = e.touches[0].clientX, cy = e.touches[0].clientY;
          dx = cx - sx;
          const dy = cy - sy;
          if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
          if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.2) {
            horizSwipe = true;
            cardGestureActive = true;
            e.stopPropagation();
            card.style.transform = `translateX(${Math.max(-85, Math.min(85, dx))}px)`;
          }
        }, { passive: true });

        card.addEventListener("touchend", e => {
          card.style.transform = "translateX(0)";
          if (horizSwipe) {
            e.stopPropagation();
            if (dx < -65) delNote(n.id);
            else if (dx > 65) pinNote(n.id);
          }
          setTimeout(() => { cardGestureActive = false; }, 50);
        });

        card.onclick = e => { if (!moved && !e.target.closest(".card-actions")) openView(n); };
        card.querySelector(".open-b").onclick = e => { e.stopPropagation(); openView(n); };
        card.querySelector(".pin-b").onclick = e => { e.stopPropagation(); pinNote(n.id); };
        card.querySelector(".del-b").onclick = e => { e.stopPropagation(); delNote(n.id); };
        el.appendChild(card);
      });
    }

    function updateEditPreview() {
      const bg = noteBg || "rgba(255,255,255,0.95)";
      const dark = isDarkColor(noteBg);
      [document.getElementById("editTitle"), document.getElementById("editTab"), document.getElementById("editContent")].forEach(el => {
        el.style.background = bg;
        el.style.color = dark ? "#f8fafc" : "#111111";
      });
      document.querySelectorAll("#noteSwatches .swatch").forEach(b => b.classList.toggle("active", b.dataset.notebg === noteBg));
      document.getElementById("customNoteBgPicker").value = (noteBg && noteBg.startsWith("#") && noteBg.length === 7) ? noteBg : "#ffffff";
    }

    function openView(n) {
      viewId = n.id;
      document.getElementById("viewTitle").textContent = n.title || "Untitled Note";
      document.getElementById("viewMeta").textContent = (n.tab ? "Tab: " + n.tab + " • " : "") + new Date(n.updatedAt || Date.now()).toLocaleString();
      document.getElementById("viewBody").textContent = n.content || "";
      viewModal.classList.add("open");
    }

    function openEdit(n = null) {
      editId = n ? n.id : null;
      document.getElementById("editHeading").textContent = n ? "Edit Note" : "New Note";
      document.getElementById("editTitle").value = n ? (n.title || "") : "";
      document.getElementById("editTab").value = n ? (n.tab || "") : "";
      document.getElementById("editContent").value = n ? (n.content || "") : "";
      noteBg = n ? (n.bgColor || "") : "";
      updateEditPreview();
      editModal.classList.add("open");
    }

    function saveNote() {
      const title = document.getElementById("editTitle").value.trim();
      const tab = document.getElementById("editTab").value.trim();
      const content = document.getElementById("editContent").value;
      if (!title && !content.trim()) { editModal.classList.remove("open"); return; }
      if (editId) {
        const i = notes.findIndex(x => x.id === editId);
        if (i !== -1) notes[i] = { ...notes[i], title, tab, content, bgColor: noteBg, updatedAt: Date.now() };
      } else {
        notes.unshift({ id: String(Date.now() + Math.random()), title, tab, content, bgColor: noteBg, isPinned: false, updatedAt: Date.now() });
      }
      save(); editModal.classList.remove("open"); render(); setPage(0);
    }

    function pinNote(id) {
      const i = notes.findIndex(x => x.id === id);
      if (i !== -1) { notes[i].isPinned = !notes[i].isPinned; save(); render(); }
    }

    function delNote(id) {
      const idx = notes.findIndex(x => x.id === id);
      if (idx === -1) return;
      lastDeleted = { note: notes[idx], index: idx };
      notes.splice(idx, 1);
      save(); render();
      notify(`Deleted "${lastDeleted.note.title || "Untitled Note"}"`, true);
    }

    function undoDelete() {
      if (!lastDeleted) return;
      notes.splice(Math.min(lastDeleted.index, notes.length), 0, lastDeleted.note);
      lastDeleted = null;
      save(); render();
      banner.classList.remove("show");
    }

    function exportDb() {
      const str = JSON.stringify({ format: "notedatabase", version: 4, exportedAt: new Date().toISOString(), notes }, null, 2);
      const fn = `Notepad_${new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14)}.notedatabase`;
      if (window.AndroidBridge && typeof window.AndroidBridge.saveBackupFile === "function") {
        window.AndroidBridge.saveBackupFile(fn, str);
        notify("Choose folder to save " + fn);
        return;
      }
      const blob = new Blob([str], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = fn;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      notify("Exported " + fn);
    }

    function extractJsonBlocks(str) {
      const blocks = [];
      let depth = 0, start = -1, inStr = false, escaped = false;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (inStr) {
          if (escaped) escaped = false;
          else if (ch === "\\") escaped = true;
          else if (ch === '"') inStr = false;
          continue;
        }
        if (ch === '"') { inStr = true; continue; }
        if (ch === "{" || ch === "[") {
          if (depth === 0) start = i;
          depth++;
        } else if (ch === "}" || ch === "]") {
          if (depth > 0) {
            depth--;
            if (depth === 0 && start !== -1) { blocks.push(str.slice(start, i + 1)); start = -1; }
          }
        }
      }
      return blocks;
    }

    function extractNotes(val, tab = "", seen = new Set(), out = []) {
      if (!val || typeof val !== "object" || seen.has(val)) return out;
      seen.add(val);
      if (Array.isArray(val)) {
        for (const it of val) {
          if (typeof it === "string" && it.trim()) {
            out.push({ id: String(Date.now() + Math.random()), title: tab || "Restored Note", tab, content: it.trim(), bgColor: "", isPinned: false, updatedAt: Date.now() });
          } else extractNotes(it, tab, seen, out);
        }
        return out;
      }
      const tName = typeof val.tab === "string" ? val.tab : typeof val.tabName === "string" ? val.tabName : typeof val.category === "string" ? val.category : tab;
      const title = typeof val.title === "string" ? val.title : typeof val.name === "string" ? val.name : "";
      const body = typeof val.content === "string" ? val.content : typeof val.body === "string" ? val.body : typeof val.text === "string" ? val.text : typeof val.note === "string" ? val.note : "";
      const ts = Number(val.updatedAt || val.createdAt);
      if (title.trim() || body.trim()) {
        out.push({
          id: String(Date.now() + Math.random()),
          title: title.trim() || (tName ? tName + " Note" : "Restored Note"),
          tab: tName.trim(), content: body,
          bgColor: typeof val.bgColor === "string" ? val.bgColor : "",
          isPinned: Boolean(val.isPinned || val.pinned),
          updatedAt: Number.isFinite(ts) && ts > 0 ? ts : Date.now()
        });
      }
      for (const [k, v] of Object.entries(val)) {
        if (v && typeof v === "object") {
          const nextTab = ["tabs", "pages", "folders", "categories"].includes(k.toLowerCase()) && typeof val.name === "string" ? val.name : tName;
          extractNotes(v, nextTab, seen, out);
        }
      }
      return out;
    }

    async function restoreFiles(files) {
      let added = 0, skipped = 0;
      const existingKeys = new Set(notes.map(n => `${n.title}::${n.tab}::${n.content}`));
      for (const f of files) {
        const txt = await f.text();
        let arr = [];
        try { arr = extractNotes(JSON.parse(txt)); }
        catch {
          for (const block of extractJsonBlocks(txt)) {
            try { arr.push(...extractNotes(JSON.parse(block))); } catch {}
          }
        }
        if (!arr.length && txt.trim()) {
          const secs = txt.replace(/\0/g, "").split(/\n\s*(?:-{3,}|={3,}|\*{3,})\s*\n/g).filter(Boolean);
          const base = f.name.replace(/\.[^/.]+$/, "") || "Restored Note";
          secs.forEach((s, i) => arr.push({
            id: String(Date.now() + Math.random()),
            title: secs.length > 1 ? `${base} #${i + 1}` : base,
            tab: secs.length > 1 ? base : "",
            content: s.trim(), bgColor: "", isPinned: false, updatedAt: Date.now()
          }));
        }
        for (const n of arr) {
          const sig = `${n.title}::${n.tab}::${n.content}`;
          if (existingKeys.has(sig)) { skipped++; continue; }
          existingKeys.add(sig);
          notes.unshift(n);
          added++;
        }
      }
      if (added > 0) {
        save(); render(); setPage(0);
        notify(`Restored ${added} note(s)` + (skipped ? ` (${skipped} duplicates skipped).` : "."));
      } else if (skipped > 0) notify(`All ${skipped} note(s) already exist.`);
      else notify("No notes found in file.");
    }

    function compressPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const maxDim = 1280;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function render() {
      document.getElementById("tab0").textContent = `All (${notes.length})`;
      document.getElementById("tab1").textContent = `Pinned (${notes.filter(n => n.isPinned).length})`;
      renderPills();
      renderList(pageAll, filtered(false), "No notes yet. Tap + New Note to start.");
      renderList(pagePinned, filtered(true), "No pinned notes.");
    }

    let psx = 0, psy = 0;
    viewport.addEventListener("touchstart", e => { psx = e.touches[0].clientX; psy = e.touches[0].clientY; }, { passive: true });
    viewport.addEventListener("touchend", e => {
      if (cardGestureActive) return;
      const dx = e.changedTouches[0].clientX - psx, dy = e.changedTouches[0].clientY - psy;
      if (Math.abs(dx) > 85 && Math.abs(dx) > Math.abs(dy) * 1.6) {
        if (dx < 0 && curPage < 2) setPage(curPage + 1);
        if (dx > 0 && curPage > 0) setPage(curPage - 1);
      }
    }, { passive: true });

    document.getElementById("tab0").onclick = () => setPage(0);
    document.getElementById("tab1").onclick = () => setPage(1);
    document.getElementById("tab2").onclick = () => setPage(2);
    document.getElementById("searchInput").oninput = e => { qStr = e.target.value; render(); };
    document.getElementById("newNoteBtn").onclick = () => openEdit(null);
    document.getElementById("closeViewBtn").onclick = () => viewModal.classList.remove("open");
    document.getElementById("editFromViewBtn").onclick = () => {
      const t = notes.find(x => x.id === viewId);
      viewModal.classList.remove("open");
      if (t) openEdit(t);
    };
    document.getElementById("cancelEditBtn").onclick = () => editModal.classList.remove("open");
    document.getElementById("saveEditBtn").onclick = saveNote;
    document.getElementById("bannerOk").onclick = () => banner.classList.remove("show");
    bannerUndo.onclick = undoDelete;

    document.getElementById("exportBtn").onclick = exportDb;
    document.getElementById("importBtn").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("fileInput").onchange = e => {
      if (e.target.files?.length) { restoreFiles(e.target.files); e.target.value = ""; }
    };

    document.getElementById("chooseBgBtn").onclick = () => document.getElementById("bgPhotoInput").click();
    document.getElementById("bgPhotoInput").onchange = async e => {
      const file = e.target.files?.[0];
      e.target.value = "";
      if (!file) return;
      try {
        const dataUrl = await compressPhoto(file);
        applyPrefs({ ...getPrefs(), photo: dataUrl });
        notify("Background photo updated.");
      } catch { notify("Could not load selected image."); }
    };
    removeBgBtn.onclick = () => {
      applyPrefs({ ...getPrefs(), photo: "" });
      notify("Background photo removed.");
    };

    const opS = document.getElementById("opSlider"), brS = document.getElementById("brSlider");
    function updS() { applyPrefs({ ...getPrefs(), opacity: Number(opS.value), brightness: Number(brS.value) }); }
    opS.oninput = updS; brS.oninput = updS;

    document.querySelectorAll("#scrimSwatches .swatch").forEach(b => b.onclick = () => applyPrefs({ ...getPrefs(), scrim: b.dataset.scrim }));
    document.getElementById("customScrimPicker").oninput = e => {
      const h = e.target.value, r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
      applyPrefs({ ...getPrefs(), scrim: `rgba(${r},${g},${b},0.68)` });
    };

    document.querySelectorAll("#noteSwatches .swatch").forEach(b => b.onclick = () => { noteBg = b.dataset.notebg; updateEditPreview(); });
    document.getElementById("customNoteBgPicker").oninput = e => { noteBg = e.target.value; updateEditPreview(); };

    load(); render(); setPage(0);
  </script>
</body>
</html>

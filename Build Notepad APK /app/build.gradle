plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offline.notepad'
    compileSdk 35

    defaultConfig {
        applicationId "com.offline.notepad"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
